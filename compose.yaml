services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aquatrace
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: aquatrace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aquatrace_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquatrace"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  aquatrace_pg:
