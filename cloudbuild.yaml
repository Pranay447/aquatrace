steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_WEB_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--target', 'migration', '-t', '${_MIGRATION_IMAGE}', '.']
images:
  - '${_WEB_IMAGE}'
  - '${_MIGRATION_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
